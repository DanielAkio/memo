<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: radial-gradient(120% 140% at 15% 0%, #1d2133 0%, #121420 55%, #0c0d14 100%); --app: #17181b; --app-line: #26272b; --app-text: #d0d6e0; --app-mute: #6f7480; --app-head: #1c1d21; --dock: rgba(255,255,255,.06); --dock-i: rgba(255,255,255,.08); --sel: #5e6ad2; }
  :root[data-theme="light"] { --bg: radial-gradient(120% 140% at 15% 0%, #e9eef7 0%, #dde3ef 55%, #cfd6e6 100%); --app: #ffffff; --app-line: #e3e5ea; --app-text: #2a2c33; --app-mute: #8a8f99; --app-head: #f6f7f9; --dock: rgba(255,255,255,.55); --dock-i: rgba(0,0,0,.07); }
  html, body { background: var(--bg); margin: 0; width: 960px; height: 540px; overflow: hidden; font-family: Inter, sans-serif; }
  #desk { position: absolute; inset: 0; background: var(--bg); transform-origin: 0 0; }
  .win { position: absolute; box-shadow: 0 12px 32px rgba(0,0,0,.28); transition: opacity .18s; }
  :root[data-theme="light"] .win { box-shadow: 0 10px 28px rgba(30,40,70,.16); }
  .win.gone { opacity: 0; pointer-events: none; }
  .win iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; color-scheme: normal; }
  #cursor { position: absolute; left: 0; top: 0; z-index: 99999; pointer-events: none; width: 18px; height: 24px; }
  #cursor svg { display: none; }
  #cursor[data-kind="arrow"] .arrow, #cursor[data-kind="text"] .text, #cursor[data-kind="hand"] .arrow { display: block; }
  #cursor[data-kind="none"] { display: none; }
  /* fake apps */
  .app { position: absolute; background: var(--app); border: 1px solid var(--app-line); border-radius: 10px; overflow: hidden; color: var(--app-text); box-shadow: 0 16px 40px rgba(0,0,0,.18); font-size: 14px; }
  .app .bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--app-line); background: var(--app-head); font-size: 13px; font-weight: 500; }
  .app .dots { display: flex; gap: 7px; margin-right: 14px; }
  .app .dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--app-line); display: block; }
  .tools { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--app-line); color: var(--app-mute); font-size: 13px; }
  .tools span { min-width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; background: var(--dock-i); }
  .tools .fx { flex: 1; justify-content: start; padding: 0 10px; display: flex; align-items: center; color: var(--app-text); }
  table.sheet { border-collapse: collapse; width: 100%; }
  .sheet td, .sheet th { border-right: 1px solid var(--app-line); border-bottom: 1px solid var(--app-line); height: 34px; padding: 0 10px; font-variant-numeric: tabular-nums; text-align: right; font-weight: 400; }
  .sheet th { color: var(--app-mute); font-size: 12px; text-align: center; background: var(--app-head); }
  .sheet td:nth-child(2) { text-align: left; }
  .sheet td.rn { color: var(--app-mute); font-size: 12px; text-align: center; background: var(--app-head); width: 34px; }
  .sheet tr:nth-child(2) td { font-weight: 600; }
  .sheet td.sel { outline: 2px solid var(--sel); outline-offset: -2px; }
  .dock { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--dock); z-index: 5; }
  .dock i { width: 30px; height: 30px; border-radius: 8px; background: var(--dock-i); display: block; }
  .dock i.on { background: #5e6ad2; }
  .dock i[data-app] { display: grid; place-items: center; color: var(--app-mute); font: 600 12px/1 Inter, sans-serif; }
  .dock i.front { box-shadow: inset 0 -2px 0 var(--sel); }
  .browser .tabs { height: 34px; display: flex; align-items: end; gap: 4px; padding: 0 12px; background: var(--app-head); }
  .browser .tab { height: 28px; padding: 0 14px; display: flex; align-items: center; border-radius: 8px 8px 0 0; color: var(--app-mute); font-size: 12px; }
  .browser .tab.on { background: var(--app); color: var(--app-text); }
  .browser .url { height: 30px; margin: 8px 14px; padding: 0 12px; display: flex; align-items: center; border-radius: 15px; background: var(--dock-i); color: var(--app-mute); font-size: 13px; }
  .browser .page { padding: 18px 28px; }
  .browser .page i { display: block; height: 12px; margin: 0 0 12px; border-radius: 6px; background: var(--dock-i); }
  .browser .page i.h { height: 26px; width: 55%; margin-bottom: 20px; }
  .browser .page i.img { height: 150px; border-radius: 10px; }
  .term { background: #0b0c0e; color: #c9d1d9; }
  .term .out { padding: 14px 16px; font: 13px/1.6 ui-monospace, Consolas, monospace; white-space: pre; }
  .term .out b { color: #7ee787; font-weight: 400; }
  /* presentation overlay: the click pulse (Memo.ring) */
  .ring { position: absolute; z-index: 99995; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid #5e6ad2; pointer-events: none; }
</style>
</head>
<body>
<div id="desk"></div>
<div id="cursor" data-kind="arrow">
  <svg class="arrow" width="18" height="24" viewBox="0 0 18 24"><path d="M1.5 1.5v18.2l4.6-4.4 3 6.8 3.1-1.4-3-6.6h6.4z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>
  <svg class="text" width="18" height="24" viewBox="0 0 18 24" style="transform:translate(-7px,-10px)"><path d="M6 2h2.2c.6 0 .8.3.8.8v18.4c0 .5-.2.8-.8.8H6m6-20H9.8c-.6 0-.8.3-.8.8m3 19.2H9.8c-.6 0-.8-.3-.8-.8" fill="none" stroke="#fff" stroke-width="3.2"/><path d="M6 2h2.2c.6 0 .8.3.8.8v18.4c0 .5-.2.8-.8.8H6m6-20H9.8c-.6 0-.8.3-.8.8m3 19.2H9.8c-.6 0-.8-.3-.8-.8" fill="none" stroke="#000" stroke-width="1.3"/></svg>
</div>
<script src="stage.js"></script>
</body>
</html>
