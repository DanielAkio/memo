[package]
name = "memo"
version = "0.3.0"
description = "Memo — sticky memories you pin on top of everything"
authors = ["Daniel Akio Teixeira"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparent windows on macOS (the Snap preview, snap.html).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri-plugin-dialog = "2"

# Native window handles, to tell whether a note is covered by other windows
# (`shows_on_screen` in main.rs): the magnet ignores notes not on screen.
raw-window-handle = "0.6"
tauri-plugin-autostart = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
tauri-plugin-opener = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tokio = { version = "1", features = ["sync", "time"] }

# Windows: which window is shown at a point (WindowFromPoint).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# macOS: the window's occlusion state (NSWindow.occlusionState).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSView", "NSWindow"] }

# Linux (X11, forced through XWayland): the stacking order of top-level windows.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
