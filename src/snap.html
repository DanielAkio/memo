<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Memo</title>
  <!-- Snap preview: shown by Rust (show_snap_preview) where a dragged window
       will land. The window is transparent and click-through; this page only
       draws a translucent rounded area, neutral enough for any wallpaper and
       both themes. -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    .zone {
      position: fixed;
      inset: 0;
      border-radius: 10px;
      background: rgba(140, 145, 155, 0.22);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55), inset 0 0 0 2px rgba(0, 0, 0, 0.18);
    }
  </style>
</head>
<body>
  <div class="zone"></div>
</body>
</html>
