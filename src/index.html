<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memo</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame" id="frame">
    <header class="titlebar" id="titlebar">
      <button class="icon-btn pin" id="pinBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <g transform="rotate(45 8 8)">
            <path class="pin-needle" d="M8 10.4V15"/>
            <path class="pin-body" d="M5.7 3.6h4.6l.7 5.1H5z"/>
            <rect class="pin-body" x="3.6" y="8.4" width="8.8" height="2" rx=".9"/>
            <rect class="pin-body" x="4.9" y="1.6" width="6.2" height="2" rx=".9"/>
          </g>
        </svg>
      </button>

      <button class="color-btn" id="colorBtn" type="button" data-i18n-attr="aria-label=noteColor" aria-haspopup="true" aria-expanded="false">
        <span class="dot" aria-hidden="true"></span>
      </button>

      <div class="identity" data-i18n-attr="title=editTitleHint">
        <span class="note-name" id="noteName"></span>
        <input class="title-input" id="titleInput" type="text" maxlength="80" spellcheck="false"
               data-i18n-attr="placeholder=noteTitle,aria-label=noteTitle" hidden>
      </div>

      <div class="actions">
        <button class="icon-btn" id="newBtn" type="button" data-i18n-attr="aria-label=newNote">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.25v9.5M3.25 8h9.5"/></svg>
        </button>
        <button class="icon-btn collapse" id="collapseBtn" type="button" aria-label="Recolher nota">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 9.75 8 6.25l3.5 3.5"/></svg>
        </button>
        <button class="icon-btn close" id="closeBtn" type="button" data-i18n-attr="aria-label=closeNote">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
        </button>
      </div>
    </header>

    <div class="menu color-menu" id="colorMenu" hidden>
      <div class="menu-label" data-i18n="noteColor"></div>
      <div class="swatches" id="swatches">
        <button type="button" class="swatch" data-color="yellow" data-i18n-attr="aria-label=yellow,title=yellow"></button>
        <button type="button" class="swatch" data-color="green" data-i18n-attr="aria-label=green,title=green"></button>
        <button type="button" class="swatch" data-color="coral" data-i18n-attr="aria-label=coral,title=coral"></button>
        <button type="button" class="swatch" data-color="teal" data-i18n-attr="aria-label=teal,title=teal"></button>
        <button type="button" class="swatch" data-color="iris" data-i18n-attr="aria-label=iris,title=iris"></button>
        <button type="button" class="swatch" data-color="lavender" data-i18n-attr="aria-label=lavender,title=lavender"></button>
        <button type="button" class="swatch" data-color="mono"></button>
        <button type="button" class="swatch" data-color="custom" data-i18n-attr="aria-label=custom,title=customMore"></button>
        <button type="button" class="swatch" data-color="" data-i18n-attr="aria-label=noColor,title=noColor"></button>
      </div>
      <!-- System colour picker, opened by the "Custom" swatch. -->
      <input type="color" class="custom-color" id="customColor" tabindex="-1" aria-hidden="true">
    </div>

    <!-- Bar shown above the selected text. Shortcuts go in the title (app.js). -->
    <div class="format-bar" id="formatBar" role="toolbar" data-i18n-attr="aria-label=formatting" hidden>
      <button type="button" class="fmt-btn" data-cmd="bold" data-key="B" data-i18n-attr="aria-label=bold" aria-pressed="false"><b data-i18n="boldLetter"></b></button>
      <button type="button" class="fmt-btn" data-cmd="italic" data-key="I" data-i18n-attr="aria-label=italic" aria-pressed="false"><i data-i18n="italicLetter"></i></button>
      <button type="button" class="fmt-btn" data-cmd="underline" data-key="U" data-i18n-attr="aria-label=underline" aria-pressed="false"><u data-i18n="underlineLetter"></u></button>
      <button type="button" class="fmt-btn fmt-mark" data-cmd="highlight" data-key="H" data-shift="1" data-i18n-attr="aria-label=highlight" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.2 2.8l3 3-6.4 6.4H3.8v-3z"/><path d="M2.5 14.5h11"/></svg>
      </button>
      <button type="button" class="fmt-btn fmt-mark" data-cmd="code" data-key="E" data-i18n-attr="aria-label=code" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></svg>
      </button>
      <span class="fmt-sep" aria-hidden="true"></span>
      <span class="fmt-sizes" role="group" data-i18n-attr="aria-label=textSize">
        <button type="button" class="fmt-btn fmt-size sz-s" data-size="2" data-i18n-attr="aria-label=smallText" aria-pressed="false">A</button>
        <button type="button" class="fmt-btn fmt-size sz-m" data-size="3" data-i18n-attr="aria-label=normalText" aria-pressed="false">A</button>
        <button type="button" class="fmt-btn fmt-size sz-l" data-size="5" data-i18n-attr="aria-label=largeText" aria-pressed="false">A</button>
      </span>
    </div>

    <main class="body">
      <div class="editor" id="editor" contenteditable="true" spellcheck="true" lang="pt-BR" role="textbox"
           aria-multiline="true" data-i18n-attr="aria-label=noteText"
           data-placeholder=""></div>
      <!-- Highlighted copies of the code blocks, drawn over them, plus their
           language pickers (app.js, "code highlighting"). -->
      <div class="code-layer" id="codeLayer"></div>
    </main>

    <footer class="statusbar">
      <span id="edited"></span>
      <span id="count"></span>
      <span class="grip" id="grip" aria-hidden="true">
        <svg viewBox="0 0 10 10"><path d="M9 3 3 9M9 6 6 9"/></svg>
      </span>
    </footer>
  </div>

  <script src="i18n.js"></script>
  <script src="chrome.js"></script>
  <script src="vendor/prism.js" data-manual></script>
  <script src="app.js"></script>
</body>
</html>
