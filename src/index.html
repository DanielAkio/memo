<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxinha</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame" id="frame">
    <header class="titlebar" id="titlebar">
      <button class="icon-btn pin" id="pinBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <g transform="rotate(45 8 8)">
            <path class="pin-needle" d="M8 10.4V15"/>
            <path class="pin-body" d="M5.7 3.6h4.6l.7 5.1H5z"/>
            <rect class="pin-body" x="3.6" y="8.4" width="8.8" height="2" rx=".9"/>
            <rect class="pin-body" x="4.9" y="1.6" width="6.2" height="2" rx=".9"/>
          </g>
        </svg>
      </button>

      <button class="color-btn" id="colorBtn" type="button" aria-label="Cor da nota" aria-haspopup="true" aria-expanded="false">
        <span class="dot" aria-hidden="true"></span>
      </button>

      <div class="identity" title="Clique duplo para editar o título">
        <span class="note-name" id="noteName"></span>
        <input class="title-input" id="titleInput" type="text" maxlength="80" spellcheck="false"
               placeholder="Título da nota" aria-label="Título da nota" hidden>
      </div>

      <div class="actions">
        <button class="icon-btn" id="newBtn" type="button" aria-label="Nova nota">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.25v9.5M3.25 8h9.5"/></svg>
        </button>
        <button class="icon-btn collapse" id="collapseBtn" type="button" aria-label="Recolher nota">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 9.75 8 6.25l3.5 3.5"/></svg>
        </button>
        <button class="icon-btn close" id="closeBtn" type="button" aria-label="Fechar nota">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
        </button>
      </div>
    </header>

    <div class="menu color-menu" id="colorMenu" hidden>
      <div class="menu-label">Cor da nota</div>
      <div class="swatches" id="swatches">
        <button type="button" class="swatch" data-color="yellow" aria-label="Amarelo" title="Amarelo"></button>
        <button type="button" class="swatch" data-color="green" aria-label="Verde" title="Verde"></button>
        <button type="button" class="swatch" data-color="coral" aria-label="Coral" title="Coral"></button>
        <button type="button" class="swatch" data-color="teal" aria-label="Azul-petróleo" title="Azul-petróleo"></button>
        <button type="button" class="swatch" data-color="iris" aria-label="Íris" title="Íris"></button>
        <button type="button" class="swatch" data-color="lavender" aria-label="Lavanda" title="Lavanda"></button>
        <button type="button" class="swatch" data-color="mono" aria-label="Branco" title="Branco"></button>
        <button type="button" class="swatch" data-color="custom" aria-label="Personalizada" title="Personalizada…"></button>
        <button type="button" class="swatch" data-color="" aria-label="Sem cor" title="Sem cor"></button>
      </div>
      <!-- Seletor de cor do sistema, aberto pelo botão "Personalizada". -->
      <input type="color" class="custom-color" id="customColor" tabindex="-1" aria-hidden="true">
    </div>

    <!-- Barra que aparece acima do texto selecionado. Os atalhos vão no title (app.js). -->
    <div class="format-bar" id="formatBar" role="toolbar" aria-label="Formatação" hidden>
      <button type="button" class="fmt-btn" data-cmd="bold" data-key="B" aria-label="Negrito" aria-pressed="false"><b>N</b></button>
      <button type="button" class="fmt-btn" data-cmd="italic" data-key="I" aria-label="Itálico" aria-pressed="false"><i>I</i></button>
      <button type="button" class="fmt-btn" data-cmd="underline" data-key="U" aria-label="Sublinhado" aria-pressed="false"><u>S</u></button>
      <span class="fmt-sep" aria-hidden="true"></span>
      <span class="fmt-sizes" role="group" aria-label="Tamanho do texto">
        <button type="button" class="fmt-btn fmt-size sz-s" data-size="2" aria-label="Texto pequeno" aria-pressed="false">A</button>
        <button type="button" class="fmt-btn fmt-size sz-m" data-size="3" aria-label="Texto normal" aria-pressed="false">A</button>
        <button type="button" class="fmt-btn fmt-size sz-l" data-size="5" aria-label="Texto grande" aria-pressed="false">A</button>
      </span>
    </div>

    <main class="body">
      <div class="editor" id="editor" contenteditable="true" spellcheck="true" lang="pt-BR" role="textbox"
           aria-multiline="true" aria-label="Texto da nota"
           data-placeholder="Escreva algo…"></div>
    </main>

    <footer class="statusbar">
      <span id="edited"></span>
      <span id="count"></span>
      <span class="grip" id="grip" aria-hidden="true">
        <svg viewBox="0 0 10 10"><path d="M9 3 3 9M9 6 6 9"/></svg>
      </span>
    </footer>
  </div>

  <script src="chrome.js"></script>
  <script src="app.js"></script>
</body>
</html>
