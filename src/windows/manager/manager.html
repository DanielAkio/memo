<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador do Memo</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <!-- Manager window: notes and trash management. Same titlebar as the notes
       (pin, new note, close), with no editable title. -->
  <div class="frame" id="frame" data-color="">
    <header class="titlebar" id="titlebar">
      <button class="icon-btn pin" id="pinBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <g transform="translate(-.4 .4) rotate(45 8 8)">
            <path class="pin-needle" d="M8 11.1v4.4"/>
            <path class="pin-body" d="M5.45 8.35V2.4a1.5 1.5 0 0 1 1.5-1.5h2.1a1.5 1.5 0 0 1 1.5 1.5v5.95h1.55a1.35 1.35 0 0 1 0 2.7H3.9a1.35 1.35 0 0 1 0-2.7z"/>
          </g>
        </svg>
      </button>
      <!-- Manager icon in the window's colour: its colour picker (the
           manager's counterpart of a note's dot or a group's folder). -->
      <button class="mgr-icon" id="mgrColorBtn" type="button" data-i18n-attr="aria-label=managerColor,title=managerColor" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.75" y="2.75" width="10.5" height="10.5" rx="2"/><path d="M5.25 6h5.5M5.25 8.25h5.5M5.25 10.5h3.25"/></svg>
      </button>
      <span class="win-name mgr-title" data-i18n="manager"></span>
      <div class="actions">
        <button class="icon-btn" id="newGroupBtn" type="button" data-i18n-attr="aria-label=newGroup,title=newGroup">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.25a1 1 0 0 1 1-1h2.9l1.5 1.5h4.6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z" stroke-width="1.3"/></svg>
        </button>
        <button class="icon-btn" id="newBoardBtn" type="button" data-i18n-attr="aria-label=newBoard,title=newBoard">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="2.5" width="3.5" height="11" rx="1" stroke-width="1.3"/>
            <rect x="6.25" y="2.5" width="3.5" height="7.5" rx="1" stroke-width="1.3"/>
            <rect x="10.5" y="2.5" width="3.5" height="9.5" rx="1" stroke-width="1.3"/>
          </svg>
        </button>
        <button class="icon-btn" id="newBtn" type="button" data-i18n-attr="aria-label=newNote">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.25v9.5M3.25 8h9.5"/></svg>
        </button>
        <button class="icon-btn close" id="closeBtn" type="button" data-i18n-attr="aria-label=minimize,title=minimize">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.75 8.5h8.5"/></svg>
        </button>
      </div>
    </header>

    <!-- Colour picker under the titlebar, as in a note or group. -->
    <div class="menu color-menu" id="mgrColorMenu" hidden>
      <div class="menu-label" data-i18n="managerColor"></div>
      <div class="swatches" id="mgrSwatches">
        <button type="button" class="swatch" data-color="yellow" data-i18n-attr="aria-label=yellow,title=yellow"></button>
        <button type="button" class="swatch" data-color="green" data-i18n-attr="aria-label=green,title=green"></button>
        <button type="button" class="swatch" data-color="coral" data-i18n-attr="aria-label=coral,title=coral"></button>
        <button type="button" class="swatch" data-color="teal" data-i18n-attr="aria-label=teal,title=teal"></button>
        <button type="button" class="swatch" data-color="iris" data-i18n-attr="aria-label=iris,title=iris"></button>
        <button type="button" class="swatch" data-color="mono"></button>
        <button type="button" class="swatch" data-color="" data-i18n-attr="aria-label=noColor,title=noColor"></button>
        <button type="button" class="swatch" data-color="custom" data-i18n-attr="aria-label=custom,title=customMore"></button>
      </div>
      <input type="color" class="custom-color" id="mgrCustomColor" tabindex="-1" aria-hidden="true">
    </div>

    <div class="mgr-body">
      <header class="mgr-head">
        <div class="tabs" role="tablist">
          <button type="button" class="tab" role="tab" id="tabNotes" data-view="notes" aria-selected="true">
            <span data-i18n="tabNotes"></span>
          </button>
          <button type="button" class="tab" role="tab" id="tabGroups" data-view="groups" aria-selected="false">
            <span data-i18n="tabGroups"></span>
          </button>
          <button type="button" class="tab" role="tab" id="tabBoards" data-view="boards" aria-selected="false">
            <span data-i18n="tabBoards"></span>
          </button>
          <button type="button" class="tab" role="tab" id="tabSettings" data-view="settings" aria-selected="false">
            <span data-i18n="tabSettings"></span>
          </button>
          <button type="button" class="tab" role="tab" id="tabHelp" data-view="help" aria-selected="false">
            <span data-i18n="tabHelp"></span>
          </button>
        </div>
        <!-- The same sections as one select, shown instead of the tabs when
             the window is too narrow for them (manager.css). -->
        <select class="field select view-select" id="viewSelect" data-i18n-attr="aria-label=sections">
          <option value="notes"></option>
          <option value="groups"></option>
          <option value="boards"></option>
          <option value="settings"></option>
          <option value="help"></option>
        </select>
      </header>

      <!-- Memories and Groups tabs: what to list (the current ones or the
           trash), search and sort. Settings and Help: only the search. -->
      <div class="list-tools" id="searchBox">
        <div class="segmented scope" id="scopeSwitch" role="radiogroup" data-i18n-attr="aria-label=scopeLabel">
          <button type="button" class="seg" role="radio" data-scope="current" aria-checked="true" data-i18n="scopeCurrent"></button>
          <button type="button" class="seg" role="radio" data-scope="trash" aria-checked="false" data-i18n="tabTrash"></button>
        </div>
        <label class="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3 3"/></svg>
          <input type="search" id="search" data-i18n-attr="placeholder=search,aria-label=searchNotes" spellcheck="false" autocomplete="off">
        </label>
        <!-- Sort order of the list: most recent first or alphabetical by title. -->
        <label class="sort">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M2.75 10.75 5 13l2.25-2.25M11 13V3M8.75 5.25 11 3l2.25 2.25"/></svg>
          <select id="sortSelect">
            <option value="updated" data-i18n="sortRecent"></option>
            <option value="title" data-i18n="sortTitle"></option>
          </select>
        </label>
      </div>

      <div class="trash-bar" id="trashBar" hidden>
        <span id="trashInfo"></span>
        <button type="button" class="btn danger" id="emptyTrash" data-i18n="emptyTrash"></button>
      </div>

      <main class="list-wrap" id="listWrap">
        <ul class="list" id="list" role="list"></ul>
        <p class="empty" id="empty" hidden></p>
      </main>

      <section class="settings" id="settingsView" hidden>
        <div class="sec" data-sec="appearance">
          <h2 class="settings-title"><span data-i18n="appearance"></span></h2>
          <div class="setting">
            <span class="setting-label" id="themeLabel" data-i18n="theme"></span>
            <div class="segmented" id="themeSwitch" role="radiogroup" aria-labelledby="themeLabel">
              <button type="button" class="seg" role="radio" data-theme="system" aria-checked="false" data-i18n="system"></button>
              <button type="button" class="seg" role="radio" data-theme="light" aria-checked="false" data-i18n="light"></button>
              <button type="button" class="seg" role="radio" data-theme="dark" aria-checked="false" data-i18n="dark"></button>
            </div>
          </div>
          <div class="setting">
            <span class="setting-label" id="layoutLabel" data-i18n="layout"></span>
            <div class="segmented" id="layoutSwitch" role="radiogroup" aria-labelledby="layoutLabel">
              <button type="button" class="seg" role="radio" data-layout="cards" aria-checked="true" data-i18n="layoutCards"></button>
              <button type="button" class="seg" role="radio" data-layout="list" aria-checked="false" data-i18n="layoutList"></button>
            </div>
          </div>
          <div class="setting">
            <label class="setting-label" for="languageSelect" data-i18n="language"></label>
            <!-- Language names are always shown in their own language. -->
            <select class="field select" id="languageSelect">
              <option value="system" data-i18n="system"></option>
              <option value="pt-BR" lang="pt-BR">Português</option>
              <option value="en" lang="en">English</option>
            </select>
          </div>
          <div class="setting">
            <span class="setting-label" data-i18n="textSize"></span>
            <!-- Global zoom of every window (also Mod +/−, Mod 0, Mod + wheel). -->
            <div class="zoom-control">
              <button type="button" class="btn zoom-step" id="zoomOut" data-i18n-attr="aria-label=zoomOut">−</button>
              <span class="zoom-value" id="zoomValue">100%</span>
              <button type="button" class="btn zoom-step" id="zoomIn" data-i18n-attr="aria-label=zoomIn">+</button>
              <button type="button" class="btn" id="zoomReset" data-i18n="zoomReset" hidden></button>
            </div>
          </div>
        </div>
        <div class="sec" data-sec="newNotes">
          <h2 class="settings-title">
            <span data-i18n="newNotes"></span>
            <span class="info" tabindex="0" role="img" data-i18n-attr="aria-label=newNotesTip,data-tip=newNotesTip">i</span>
          </h2>
          <div class="setting">
            <span class="setting-label" data-i18n="color"></span>
            <div class="swatches" id="defaultSwatches">
              <button type="button" class="swatch" data-color="yellow" data-i18n-attr="aria-label=yellow,title=yellow"></button>
              <button type="button" class="swatch" data-color="green" data-i18n-attr="aria-label=green,title=green"></button>
              <button type="button" class="swatch" data-color="coral" data-i18n-attr="aria-label=coral,title=coral"></button>
              <button type="button" class="swatch" data-color="teal" data-i18n-attr="aria-label=teal,title=teal"></button>
              <button type="button" class="swatch" data-color="iris" data-i18n-attr="aria-label=iris,title=iris"></button>
              <button type="button" class="swatch" data-color="mono"></button>
              <button type="button" class="swatch" data-color="" data-i18n-attr="aria-label=noColor,title=noColor"></button>
              <button type="button" class="swatch" data-color="custom" data-i18n-attr="aria-label=custom,title=customMore"></button>
              <button type="button" class="swatch" data-color="random" data-i18n-attr="aria-label=randomColor,title=randomColor"></button>
            </div>
          </div>
          <div class="setting">
            <label class="setting-label" for="defaultTitle" data-i18n="title"></label>
            <input class="field" id="defaultTitle" type="text" maxlength="80" spellcheck="false"
                   autocomplete="off" data-i18n-attr="placeholder=untitled">
          </div>
          <div class="setting setting-top">
            <label class="setting-label" for="defaultTextFrame" data-i18n="text"></label>
            <div class="field-wrap">
              <!-- The note editor itself, in embedded mode: renders exactly like a note. -->
              <iframe class="field note-frame" id="defaultTextFrame" src="../note/index.html?defaults"
                      data-i18n-attr="title=text"></iframe>
            </div>
          </div>
        </div>
        <div class="sec" data-sec="groupDefaults">
          <h2 class="settings-title">
            <span data-i18n="groupDefaults"></span>
            <span class="info" tabindex="0" role="img" data-i18n-attr="aria-label=groupDefaultsTip,data-tip=groupDefaultsTip">i</span>
          </h2>
          <div class="setting">
            <span class="setting-label" data-i18n="color"></span>
            <div class="swatches" id="groupSwatches">
              <button type="button" class="swatch" data-color="yellow" data-i18n-attr="aria-label=yellow,title=yellow"></button>
              <button type="button" class="swatch" data-color="green" data-i18n-attr="aria-label=green,title=green"></button>
              <button type="button" class="swatch" data-color="coral" data-i18n-attr="aria-label=coral,title=coral"></button>
              <button type="button" class="swatch" data-color="teal" data-i18n-attr="aria-label=teal,title=teal"></button>
              <button type="button" class="swatch" data-color="iris" data-i18n-attr="aria-label=iris,title=iris"></button>
              <button type="button" class="swatch" data-color="mono"></button>
              <button type="button" class="swatch" data-color="" data-i18n-attr="aria-label=noColor,title=noColor"></button>
              <button type="button" class="swatch" data-color="custom" data-i18n-attr="aria-label=custom,title=customMore"></button>
              <button type="button" class="swatch" data-color="random" data-i18n-attr="aria-label=randomColor,title=randomColor"></button>
            </div>
          </div>
          <div class="setting">
            <label class="setting-label" for="groupDefaultTitle" data-i18n="title"></label>
            <input class="field" id="groupDefaultTitle" type="text" maxlength="60" spellcheck="false"
                   autocomplete="off" data-i18n-attr="placeholder=untitled">
          </div>
        </div>
        <!-- Cloud sync: only in builds with a Google or Microsoft OAuth client (cloud.rs). -->
        <div class="sec" data-sec="sync" data-cloud hidden>
          <h2 class="settings-title">
            <span data-i18n="sync"></span>
            <span class="info" tabindex="0" role="img" data-i18n-attr="aria-label=syncTip,data-tip=syncTip">i</span>
          </h2>
          <!-- One row per cloud: connect one, the other or both. -->
          <div class="setting setting-top" data-cloud-row="google" hidden>
            <span class="setting-label" data-i18n="googleDrive"></span>
            <div class="field-wrap">
              <div class="app-actions">
                <button type="button" class="btn" data-cloud-act="connect" data-i18n="cloudConnect"></button>
                <button type="button" class="btn" data-cloud-act="cancel" data-i18n="cancel" hidden></button>
                <button type="button" class="btn" data-cloud-act="sync" data-i18n="cloudSyncNow" hidden></button>
                <button type="button" class="btn" data-cloud-act="disconnect" data-i18n="cloudDisconnect" hidden></button>
              </div>
              <p class="storage-status" data-cloud-status role="status"></p>
            </div>
          </div>
          <div class="setting setting-top" data-cloud-row="microsoft" hidden>
            <span class="setting-label" data-i18n="oneDrive"></span>
            <div class="field-wrap">
              <div class="app-actions">
                <button type="button" class="btn" data-cloud-act="connect" data-i18n="cloudConnect"></button>
                <button type="button" class="btn" data-cloud-act="cancel" data-i18n="cancel" hidden></button>
                <button type="button" class="btn" data-cloud-act="sync" data-i18n="cloudSyncNow" hidden></button>
                <button type="button" class="btn" data-cloud-act="disconnect" data-i18n="cloudDisconnect" hidden></button>
              </div>
              <p class="storage-status" data-cloud-status role="status"></p>
            </div>
          </div>
        </div>
        <div class="sec" data-sec="aiControl">
          <h2 class="settings-title">
            <span data-i18n="aiControl"></span>
            <span class="info" tabindex="0" role="img" data-i18n-attr="aria-label=aiControlTip,data-tip=aiControlTip">i</span>
          </h2>
          <div class="setting">
            <span class="setting-label" id="aiControlLabel" data-i18n="aiControlAllow"></span>
            <!-- On/off switch: the MCP server (mcp.rs). Off by default. -->
            <button type="button" class="switch" id="aiControlSwitch" role="switch" aria-checked="false" aria-labelledby="aiControlLabel"></button>
          </div>
          <div class="setting setting-top" id="aiClientsRow" hidden>
            <span class="setting-label" data-i18n="aiApps"></span>
            <div class="field-wrap">
              <!-- The MCP clients installed here (clients.rs): Connect adds Memo
                   to the app's config file. Filled by manager.js. -->
              <ul class="ai-clients" id="aiClients"></ul>
              <p class="storage-status" id="aiClientsStatus" role="status"></p>
            </div>
          </div>
          <div class="setting setting-top" id="aiSetup" hidden>
            <span class="setting-label" data-i18n="aiManual"></span>
            <div class="field-wrap">
              <!-- Any other MCP client: pick its config format, copy, paste. App
                   names are not translated. -->
              <div class="app-actions ai-setup">
                <select class="field select" id="aiAppSelect" data-i18n-attr="aria-label=aiApp,title=aiApp">
                  <option value="json">JSON: Claude Desktop, Cursor, Gemini…</option>
                  <option value="vscode">VS Code (GitHub Copilot)</option>
                  <option value="claude">Claude Code</option>
                  <option value="codex">Codex CLI</option>
                  <option value="command" data-i18n="aiAppOther"></option>
                </select>
                <button type="button" class="btn" id="aiCopyBtn" data-i18n="aiCopy"></button>
              </div>
              <p class="storage-status" id="aiStatus" role="status"></p>
            </div>
          </div>
        </div>
        <div class="sec" data-sec="storage">
          <h2 class="settings-title">
            <span data-i18n="storage"></span>
            <span class="info" tabindex="0" role="img" data-i18n-attr="aria-label=storageTip,data-tip=storageTip">i</span>
          </h2>
          <div class="setting setting-top">
            <span class="setting-label" data-i18n="dataFolder"></span>
            <div class="field-wrap">
              <!-- "Change…" on the left, the current path beside it. -->
              <div class="data-dir-row">
                <button type="button" class="btn" id="chooseDirBtn" data-i18n="changeFolder"></button>
                <div class="data-dir" id="dataDir"></div>
              </div>
              <button type="button" class="btn reset-dir" id="resetDirBtn" data-i18n="useDefaultFolder" hidden></button>
            </div>
          </div>
          <div class="setting setting-top">
            <span class="setting-label">
              <span data-i18n="backup"></span>
              <span class="info" tabindex="0" role="img" data-i18n-attr="aria-label=backupTip,data-tip=backupTip">i</span>
            </span>
            <div class="field-wrap">
              <div class="app-actions">
                <button type="button" class="btn" id="exportBtn" data-i18n="exportNotes"></button>
                <button type="button" class="btn" id="importBtn" data-i18n="importNotes"></button>
              </div>
              <p class="storage-status" id="storageStatus" role="status" hidden></p>
            </div>
          </div>
        </div>
        <div class="sec" data-sec="application">
          <h2 class="settings-title"><span data-i18n="application"></span></h2>
          <div class="setting">
            <span class="setting-label" id="magnetLabel" data-i18n="magnet"></span>
            <!-- On/off switch: windows stick to screen edges and to each other
                 while dragged or resized; notes fold onto their titlebar. -->
            <button type="button" class="switch" id="magnetSwitch" role="switch" aria-checked="true" aria-labelledby="magnetLabel"></button>
          </div>
          <div class="setting">
            <span class="setting-label" id="autostartLabel" data-i18n="autostart"></span>
            <!-- On/off switch: opens Memo when the user logs in (only its
                 memories; the manager stays closed). -->
            <button type="button" class="switch" id="autostartSwitch" role="switch" aria-checked="false" aria-labelledby="autostartLabel"></button>
          </div>
          <div class="setting setting-top">
            <span class="setting-label" data-i18n="version"></span>
            <div class="field-wrap">
              <!-- The running build's version (tauri.conf.json), to tell an old
                   install from a new one, then "Check for updates" or, once a
                   newer one is found, "Update and restart" (updater.rs). -->
              <div class="version-row">
                <span class="app-version" id="appVersion"></span>
                <button type="button" class="btn" id="updateCheckBtn" data-i18n="checkUpdates"></button>
                <button type="button" class="btn" id="updateInstallBtn" data-i18n="updateInstall" hidden></button>
              </div>
              <p class="storage-status" id="updateStatus" role="status" hidden></p>
            </div>
          </div>
          <div class="setting">
            <span class="setting-label" id="autoUpdateLabel" data-i18n="autoUpdate"></span>
            <!-- On/off switch: checks for a new version on launch and every few
                 hours. On by default. -->
            <button type="button" class="switch" id="autoUpdateSwitch" role="switch" aria-checked="true" aria-labelledby="autoUpdateLabel"></button>
          </div>
          <div class="setting">
            <span class="setting-label" data-i18n="exit"></span>
            <div class="app-actions">
              <button type="button" class="btn danger" id="quitBtn" data-i18n="quit"></button>
            </div>
          </div>
        </div>
        <p class="empty sec-empty" hidden></p>
        <input type="color" class="custom-color" id="groupCustomColor" tabindex="-1" aria-hidden="true">
        <input type="color" class="custom-color" id="customColor" tabindex="-1" aria-hidden="true">
      </section>

      <!-- Help tab: how to use Memo, grouped by topic. The groups come from
           MemoI18n.help() and are rendered by manager.js (renderHelp). -->
      <section class="settings help" id="helpView" hidden>
        <div class="help-top">
          <p class="help-intro" data-i18n="helpIntro"></p>
          <button type="button" class="btn" id="helpBtn" data-i18n="openWelcome"></button>
        </div>
        <div id="helpGroups"></div>
        <p class="empty sec-empty" hidden></p>
      </section>
    </div>

    <span class="grip" id="grip" aria-hidden="true">
      <svg viewBox="0 0 10 10"><path d="M9 3 3 9M9 6 6 9"/></svg>
    </span>
  </div>

  <script src="../../lib/i18n.js"></script>
  <script src="../../lib/chrome.js"></script>
  <script src="../../components/color-menu.js"></script>
  <script src="../../components/toast.js"></script>
  <script src="../../components/share.js"></script>
  <script src="../../components/update.js"></script>
  <script src="../../components/confirm.js"></script>
  <script src="../../components/titlebar.js"></script>
  <script src="../../components/pill.js"></script>
  <script src="../../components/text.js"></script>
  <script src="../../components/card.js"></script>
  <script src="../../vendor/prism.js" data-manual></script>
  <script src="manager.js"></script>
</body>
</html>
