<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memo</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="note.css">
</head>
<body>
  <div class="frame" id="frame">
    <div class="group-tint" id="groupTint" aria-hidden="true"></div>
    <header class="titlebar" id="titlebar">
      <button class="icon-btn pin" id="pinBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <g transform="translate(-.4 .4) rotate(45 8 8)">
            <path class="pin-needle" d="M8 11.1v4.4"/>
            <path class="pin-body" d="M5.45 8.35V2.4a1.5 1.5 0 0 1 1.5-1.5h2.1a1.5 1.5 0 0 1 1.5 1.5v5.95h1.55a1.35 1.35 0 0 1 0 2.7H3.9a1.35 1.35 0 0 1 0-2.7z"/>
          </g>
        </svg>
      </button>

      <button class="color-btn" id="colorBtn" type="button" data-i18n-attr="aria-label=noteColor" aria-haspopup="true" aria-expanded="false">
        <span class="dot" aria-hidden="true"></span>
      </button>

      <div class="identity">
        <span class="win-name" id="noteName"></span>
        <input class="title-input" id="titleInput" type="text" maxlength="80" spellcheck="false"
               data-i18n-attr="placeholder=noteTitle,aria-label=noteTitle" hidden>
      </div>

      <div class="actions">
        <button class="icon-btn" id="newBtn" type="button" data-i18n-attr="aria-label=newNote">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.25v9.5M3.25 8h9.5"/></svg>
        </button>
        <button class="icon-btn close" id="closeBtn" type="button" data-i18n-attr="aria-label=minimizeNote,title=minimizeNote">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.75 8.5h8.5"/></svg>
        </button>
        <button class="icon-btn trash" id="trashBtn" type="button" data-i18n-attr="aria-label=moveToTrash,title=moveToTrash">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.25 4.25l7.5 7.5M11.75 4.25l-7.5 7.5"/></svg>
        </button>
      </div>
    </header>

    <div class="menu color-menu" id="colorMenu" hidden>
      <div class="menu-label" data-i18n="noteColor"></div>
      <div class="swatches" id="swatches">
        <button type="button" class="swatch" data-color="yellow" data-i18n-attr="aria-label=yellow,title=yellow"></button>
        <button type="button" class="swatch" data-color="green" data-i18n-attr="aria-label=green,title=green"></button>
        <button type="button" class="swatch" data-color="coral" data-i18n-attr="aria-label=coral,title=coral"></button>
        <button type="button" class="swatch" data-color="teal" data-i18n-attr="aria-label=teal,title=teal"></button>
        <button type="button" class="swatch" data-color="iris" data-i18n-attr="aria-label=iris,title=iris"></button>
        <button type="button" class="swatch" data-color="mono"></button>
        <button type="button" class="swatch" data-color="" data-i18n-attr="aria-label=noColor,title=noColor"></button>
        <button type="button" class="swatch" data-color="custom" data-i18n-attr="aria-label=custom,title=customMore"></button>
      </div>
      <!-- System colour picker, opened by the "Custom" swatch. -->
      <input type="color" class="custom-color" id="customColor" tabindex="-1" aria-hidden="true">
    </div>

    <!-- Bar shown above the selected text. Shortcuts go in the title (note.js). -->
    <div class="format-bar" id="formatBar" role="toolbar" data-i18n-attr="aria-label=formatting" hidden>
      <button type="button" class="fmt-btn" data-cmd="bold" data-key="B" data-i18n-attr="aria-label=bold" aria-pressed="false"><b data-i18n="boldLetter"></b></button>
      <button type="button" class="fmt-btn" data-cmd="italic" data-key="I" data-i18n-attr="aria-label=italic" aria-pressed="false"><i data-i18n="italicLetter"></i></button>
      <button type="button" class="fmt-btn" data-cmd="underline" data-key="U" data-i18n-attr="aria-label=underline" aria-pressed="false"><u data-i18n="underlineLetter"></u></button>
      <button type="button" class="fmt-btn fmt-mark" data-cmd="highlight" data-key="H" data-shift="1" data-i18n-attr="aria-label=highlight" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.2 2.8l3 3-6.4 6.4H3.8v-3z"/><path d="M2.5 14.5h11"/></svg>
      </button>
      <button type="button" class="fmt-btn fmt-mark" data-cmd="code" data-key="E" data-i18n-attr="aria-label=code" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></svg>
      </button>
      <button type="button" class="fmt-btn fmt-mark" data-cmd="link" data-key="K" data-i18n-attr="aria-label=link" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.8 9.2a2.6 2.6 0 0 0 3.7 0l2.2-2.2a2.6 2.6 0 0 0-3.7-3.7l-.9.9"/><path d="M9.2 6.8a2.6 2.6 0 0 0-3.7 0L3.3 9a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/></svg>
      </button>
      <span class="fmt-sep" aria-hidden="true"></span>
      <button type="button" class="fmt-btn fmt-mark" data-cmd="check" data-hint="[]" data-i18n-attr="aria-label=checklist" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><path d="M5.3 8.2l1.9 1.9 3.6-4"/></svg>
      </button>
      <button type="button" class="fmt-btn fmt-mark" data-cmd="bullet" data-hint="-" data-i18n-attr="aria-label=bulletList" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle class="fill" cx="3.5" cy="4.5" r="1"/><circle class="fill" cx="3.5" cy="11.5" r="1"/><path d="M7 4.5h6.5M7 11.5h6.5"/></svg>
      </button>
      <button type="button" class="fmt-btn fmt-mark" data-cmd="number" data-hint="1." data-i18n-attr="aria-label=numberedList" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 3.2l1.1-.8v4M2.4 9.6c.2-.8 2.2-.9 2.2.3 0 .9-2.2 1.8-2.2 3h2.3M7 4.5h6.5M7 11.5h6.5"/></svg>
      </button>
      <button type="button" class="fmt-btn fmt-mark" data-cmd="codeBlock" data-hint="```" data-i18n-attr="aria-label=codeBlock" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5"/><path d="M6.2 6.2 4.4 8l1.8 1.8M9.8 6.2 11.6 8l-1.8 1.8"/></svg>
      </button>
      <button type="button" class="fmt-btn fmt-mark" data-cmd="table" data-hint="| a | b |" data-i18n-attr="aria-label=table" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5"/><path d="M1.5 6.5h13M1.5 10h13M8 6.5v7"/></svg>
      </button>
      <span class="fmt-sep" aria-hidden="true"></span>
      <span class="fmt-sizes" role="group" data-i18n-attr="aria-label=textSize">
        <button type="button" class="fmt-btn fmt-size sz-s" data-size="2" data-i18n-attr="aria-label=smallText" aria-pressed="false">A</button>
        <button type="button" class="fmt-btn fmt-size sz-m" data-size="3" data-i18n-attr="aria-label=normalText" aria-pressed="false">A</button>
        <button type="button" class="fmt-btn fmt-size sz-l" data-size="5" data-i18n-attr="aria-label=largeText" aria-pressed="false">A</button>
      </span>
    </div>

    <!-- Address of a link (note.js, "links"): Mod+K, the link button or the
         Format menu. Open and remove show only for an existing link. -->
    <div class="link-box" id="linkBox" hidden>
      <input type="text" id="linkInput" spellcheck="false" autocomplete="off"
             data-i18n-attr="placeholder=linkPlaceholder,aria-label=linkAddress">
      <button type="button" class="fmt-btn fmt-mark link-edit" id="linkOpen" data-i18n-attr="aria-label=openLink,title=openLink">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5 7.5 8.5M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg>
      </button>
      <button type="button" class="fmt-btn fmt-mark link-edit" id="linkRemove" data-i18n-attr="aria-label=removeLink,title=removeLink">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.8 9.2a2.6 2.6 0 0 0 3.7 0l2.2-2.2a2.6 2.6 0 0 0-3.7-3.7l-.9.9"/><path d="M9.2 6.8a2.6 2.6 0 0 0-3.7 0L3.3 9a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/><path d="M2.5 2.5l11 11"/></svg>
      </button>
    </div>

    <main class="body">
      <div class="editor" id="editor" contenteditable="true" spellcheck="true" lang="pt-BR" role="textbox"
           aria-multiline="true" data-i18n-attr="aria-label=noteText"
           data-placeholder=""></div>
      <!-- Highlighted copies of the code blocks, drawn over them, plus their
           language pickers (note.js, "code highlighting"). -->
      <div class="code-layer" id="codeLayer"></div>
      <!-- Controls of the table under the mouse: "+" on its left and right
           edges (a column) and bottom edge (a row), header and delete tools
           (note.js, "tables"). -->
      <div class="table-layer" id="tableLayer" hidden>
        <div class="table-mark" hidden></div>
        <button type="button" class="table-add" data-add="left" data-i18n-attr="aria-label=addColumnLeft,title=addColumnLeft">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.5v7M4.5 8h7"/></svg>
        </button>
        <button type="button" class="table-add" data-add="right" data-i18n-attr="aria-label=addColumnRight,title=addColumnRight">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.5v7M4.5 8h7"/></svg>
        </button>
        <button type="button" class="table-add" data-add="bottom" data-i18n-attr="aria-label=addRow,title=addRow">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.5v7M4.5 8h7"/></svg>
        </button>
        <div class="table-tools" role="toolbar" data-i18n-attr="aria-label=table">
          <button type="button" data-tool="header" aria-pressed="false" data-i18n-attr="aria-label=tableHeader,title=tableHeader">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path class="fill" d="M4 2.5h8a2 2 0 0 1 2 2v2h-12v-2a2 2 0 0 1 2-2z"/><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M2 6.5h12M8 6.5v7"/></svg>
          </button>
          <button type="button" data-tool="deleteRow" data-i18n-attr="aria-label=deleteRow,title=deleteRow">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="5" width="12" height="6" rx="1.5"/><path d="M6 8h4"/></svg>
          </button>
          <button type="button" data-tool="deleteColumn" data-i18n-attr="aria-label=deleteColumn,title=deleteColumn">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="2" width="6" height="12" rx="1.5"/><path d="M6.6 8h2.8"/></svg>
          </button>
        </div>
      </div>
      <!-- Frame of the selected image, with its resize handle (note.js, "images"). -->
      <div class="image-layer" id="imageLayer">
        <div class="image-frame" id="imageFrame" hidden>
          <span class="image-handle" id="imageHandle" data-i18n-attr="title=resizeImage"></span>
        </div>
      </div>
      <!-- Caret before a list item's box or dot (note.js, "lists"). -->
      <span class="marker-caret" id="markerCaret" hidden></span>
    </main>

    <!-- Format tray: the format bar's buttons fixed above the footer, shown
         with the footer's "Aa" (note.js, "format tray"; filled from #formatBar). -->
    <div class="format-tray" id="formatTray" role="toolbar" data-i18n-attr="aria-label=formatTray" hidden></div>

    <!-- Group picker, opened from the footer: the note's group, "no group" or
         a new one (note.js, "groups"). -->
    <div class="menu group-menu" id="groupMenu" hidden>
      <div class="menu-label" data-i18n="groupMenuTitle"></div>
      <div class="menu-items" id="groupItems" role="menu"></div>
    </div>

    <footer class="statusbar">
      <!-- Bottom left: the note's group (with a folder icon) or, without one,
           "new memory" / "edited …". Clicking opens the group picker. -->
      <button class="foot-btn" id="footBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <svg class="foot-folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.25a1 1 0 0 1 1-1h2.9l1.5 1.5h4.6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/></svg><span id="edited"></span>
      </button>
      <!-- The boards it is on, as pills (shown only, as in the manager). -->
      <span class="foot-boards" id="footBoards"></span>
      <span id="count"></span>
      <button class="foot-aa" id="trayBtn" type="button" aria-pressed="false" data-i18n-attr="aria-label=formatTray,title=formatTray">Aa</button>
      <span class="grip" id="grip" aria-hidden="true">
        <svg viewBox="0 0 10 10"><path d="M9 3 3 9M9 6 6 9"/></svg>
      </span>
    </footer>
  </div>

  <script src="../../lib/i18n.js"></script>
  <script src="../../lib/chrome.js"></script>
  <script src="../../components/color-menu.js"></script>
  <script src="../../components/toast.js"></script>
  <script src="../../components/share.js"></script>
  <script src="../../components/update.js"></script>
  <script src="../../components/titlebar.js"></script>
  <script src="../../components/pill.js"></script>
  <script src="../../components/text.js"></script>
  <script src="../../components/group-picker.js"></script>
  <script src="../../vendor/prism.js" data-manual></script>
  <script src="note.js"></script>
</body>
</html>
