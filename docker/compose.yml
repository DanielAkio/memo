# Builds the Windows installer into dist/:
#   docker compose -f docker/compose.yml run --rm windows
# node_modules, target and the caches live in volumes, so they don't mix with
# the host's files and later builds don't recompile everything.
name: memo

services:
  windows:
    build:
      context: .
      dockerfile: windows.Dockerfile
    image: memo-build-windows
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - target:/app/src-tauri/target
      - cargo-registry:/usr/local/cargo/registry
      - xwin-cache:/xwin-cache
    command:
      - sh
      - -c
      - |
        set -e
        npm install --no-save --no-audit --no-fund
        npx tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis
        mkdir -p dist
        cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe dist/
        echo "Installer in dist/:" && ls dist/*-setup.exe

volumes:
  node_modules:
  target:
  cargo-registry:
  xwin-cache:
