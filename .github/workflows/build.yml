name: Build

# Manual runs only (Actions → Build → Run workflow). Run from a v* tag, it
# publishes a draft release with the Windows, macOS (Apple Silicon and Intel)
# and Linux installers. The Windows installers are signed through SignPath
# once the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable
# exist (docs/code-signing.md); without them they stay unsigned.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read # SignPath downloads the unsigned artifact

jobs:
  # The build jobs run in parallel and tauri-action creates the draft release
  # if it finds none, so two jobs could each create one. Creating it here
  # first leaves a single draft that every job uploads to.
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag --title "Memo $TAG" --notes ""

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      SIGN_WINDOWS: ${{ matrix.platform == 'windows-latest' && secrets.SIGNPATH_API_TOKEN != '' }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Google OAuth client for cloud sync (docs/google-cloud.md); without
          # these secrets the build simply has no cloud sync.
          MEMO_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MEMO_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          # Signed Windows builds reach the release after signing (below).
          tagName: ${{ env.SIGN_WINDOWS != 'true' && env.RELEASE_TAG || '' }}
          releaseName: "Memo ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}

      # tauri-action also uploads the macOS .app as .app.tar.gz, which only an
      # updater would use; Memo has none, so the release keeps the .dmg only.
      # Each macOS job removes its own architecture's tarball.
      - name: Drop the macOS .app.tar.gz from the release
        if: runner.os == 'macOS' && env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ contains(matrix.args, 'aarch64') && 'aarch64' || 'x64' }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
            { grep -E "_${ARCH}\.app\.tar\.gz$" || true; } |
            while read -r asset; do
              gh release delete-asset "$RELEASE_TAG" "$asset" -y
            done

      - name: Collect Windows installers for signing
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          mkdir unsigned
          cp src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*-setup.exe unsigned/

      - name: Upload unsigned Windows installers
        id: upload-unsigned
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memo-windows-unsigned
          path: unsigned/

      # Each request waits for a manual approval in SignPath (Foundation rule).
      - name: Sign Windows installers
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: memo
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Add signed installers to the draft release
        if: env.SIGN_WINDOWS == 'true' && env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" signed/* --clobber
          else
            gh release create "$RELEASE_TAG" signed/* --draft --title "Memo $RELEASE_TAG"
          fi

      - name: Upload signed Windows installers
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memo-windows-latest
          path: signed/

      - name: Upload installers
        if: env.SIGN_WINDOWS != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memo-${{ matrix.platform }}${{ matrix.args != '' && '-' || '' }}${{ contains(matrix.args, 'aarch64') && 'arm64' || contains(matrix.args, 'x86_64') && 'x64' || '' }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*-setup.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: ignore
