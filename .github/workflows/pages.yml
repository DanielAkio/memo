name: Pages

# Publishes site/ (home page, privacy policy and browser web app) to GitHub Pages.
# Needs Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bundle web app
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          cp -r src site/src
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            sed -i "s|name=\"memo-google-client-id\" content=\"\"|name=\"memo-google-client-id\" content=\"$GOOGLE_WEB_CLIENT_ID\"|" site/app.html
          fi
          if [ -n "$MICROSOFT_CLIENT_ID" ]; then
            sed -i "s|name=\"memo-microsoft-client-id\" content=\"\"|name=\"memo-microsoft-client-id\" content=\"$MICROSOFT_CLIENT_ID\"|" site/app.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
